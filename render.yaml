# Render blueprint. Create a Blueprint instance from the repo, then set the
# values marked sync: false in the dashboard. They are secrets and do not
# belong in git.
services:
  - type: web
    name: hype-playlist
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      - key: ANTHROPIC_API_KEY
        sync: false

      # Optional. Leave unset and the export button stays hidden.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Must be https://<your-render-domain>/api/spotify/callback and match
      # the dashboard character for character.
      - key: SPOTIFY_REDIRECT_URI
        sync: false

      # Render generates this once and keeps it, so Spotify connections
      # survive restarts.
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "1"

      # Spend guards. 0 turns a limit off.
      - key: RATE_LIMIT_PER_IP
        value: "5"
      - key: RATE_LIMIT_PER_DAY
        value: "200"
