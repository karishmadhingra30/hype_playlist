<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hype Playlist</title>
<meta name="description" content="Tell it what you are about to walk into. Get a playlist with reasons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<main class="shell">

  <header class="masthead">
    <p class="eyebrow">Hype Playlist Generator</p>
    <h1 class="display hero">What are you<br>about to walk into?</h1>
    <p class="sub">Pick the moment. Get six to twenty tracks and the reason each one is there.</p>
  </header>

  <section class="block" aria-labelledby="presets-label">
    <h2 class="label" id="presets-label">The situation</h2>
    <div class="presets" id="presets"><!-- filled from PRESETS in app.js --></div>

    <div class="own">
      <label class="label" for="situation">Or say it yourself</label>
      <input id="situation" class="own-input" type="text" autocomplete="off"
             placeholder="presenting to my skip-level for the first time">
    </div>
  </section>

  <section class="block dials" aria-label="Playlist settings">
    <div class="dial">
      <h2 class="label">How long</h2>
      <div class="segmented" id="length" role="radiogroup" aria-label="Playlist length">
        <button type="button" role="radio" aria-checked="false" data-value="short">Short<em>6</em></button>
        <button type="button" role="radio" aria-checked="true" data-value="medium">Medium<em>12</em></button>
        <button type="button" role="radio" aria-checked="false" data-value="long">Long<em>20</em></button>
      </div>
    </div>

    <div class="dial">
      <h2 class="label">How far do we go</h2>
      <div class="slider-wrap">
        <input id="vibe" class="slider" type="range" min="0" max="100" value="50" step="1"
               aria-label="Vibe: calm to unhinged">
        <div class="slider-ends">
          <span>Calm</span>
          <span class="vibe-read" id="vibe-read">Even split</span>
          <span>Unhinged</span>
        </div>
      </div>
    </div>
  </section>

  <button class="generate" id="generate" type="button">
    <span>Make the playlist</span>
    <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path d="M4 12h15m0 0-6-6m6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
  </button>

  <p class="error" id="error" hidden></p>

  <section class="loading" id="loading" hidden aria-live="polite">
    <span class="pulse" aria-hidden="true"></span>
    <p class="display loading-line" id="loading-line"></p>
  </section>

  <section class="results" id="results" hidden aria-live="polite">
    <div class="results-head">
      <p class="label">The playlist</p>
      <h2 class="display playlist-name" id="playlist-name"></h2>
      <p class="vibe-note" id="vibe-note"></p>
    </div>

    <ol class="tracks" id="tracks"></ol>

    <div class="export">
      <button class="spotify" id="spotify" type="button" hidden>Send to Spotify</button>
      <p class="whoami" id="whoami" hidden></p>
      <p class="export-note" id="export-note" hidden></p>
    </div>
  </section>

  <footer class="foot">
    <p>Built with Claude. Tracks are suggestions, not prescriptions.</p>
  </footer>

</main>

<script src="/app.js"></script>
</body>
</html>
